<text x="300" y="289" font-size="13" text-anchor="middle" fill="#222">Paredes internas, preenchimento, suporte, deslocamento</text>
<text x="300" y="332" font-size="13" text-anchor="middle" fill="#555">Topo: muda o que você vê. Base: muda principalmente o tempo.</text>
