<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350">
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="300" y="26" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">O que mais pesa na qualidade visível</text>
<polygon points="270.0,50 330.0,50 400.0,98 200.0,98" fill="#D7263D" stroke="#555555"/>
