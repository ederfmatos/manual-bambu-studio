<text x="445" y="70" font-size="13" text-anchor="start" fill="#222">Velocidade da</text>
<text x="445" y="87" font-size="13" text-anchor="start" fill="#222">parede externa</text>
<polygon points="200.0,102 400.0,102 445.0,150 155.0,150" fill="#F28C28" stroke="#555555"/>
