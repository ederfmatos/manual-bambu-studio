<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333333">Anatomia de uma peça (corte lateral)</text>
<!-- mesa -->
<rect x="40" y="270" width="320" height="12" fill="#444444"/>
<!-- corpo: paredes laterais -->
<rect x="80" y="70" width="18" height="200" fill="#F28C28"/>
<rect x="302" y="70" width="18" height="200" fill="#F28C28"/>
<!-- topo e base -->
<rect x="98" y="70" width="204" height="24" fill="#2E86AB"/>
<rect x="98" y="246" width="204" height="24" fill="#2E86AB"/>
<!-- preenchimento -->
<rect x="98" y="94" width="204" height="152" fill="#F7F7F7"/>
<g stroke="#BBBBBB" stroke-width="3">
<path d="M98 140 L144 94 M98 190 L194 94 M98 240 L244 94 M128 246 L280 94 M178 246 L302 122 M228 246 L302 172 M278 246 L302 222"/>
</g>
<!-- legendas -->
<g font-size="14" fill="#333333">
<line x1="320" y1="82" x2="380" y2="82" stroke="#888888" stroke-dasharray="4 3"/><text x="388" y="87">Camadas superiores</text>
<line x1="311" y1="160" x2="380" y2="160" stroke="#888888" stroke-dasharray="4 3"/><text x="388" y="165">Paredes (contorno)</text>
<line x1="270" y1="200" x2="380" y2="200" stroke="#888888" stroke-dasharray="4 3"/><text x="388" y="205">Preenchimento esparso</text>
<line x1="320" y1="258" x2="380" y2="258" stroke="#888888" stroke-dasharray="4 3"/><text x="388" y="263">Camadas inferiores</text>
</g>
<g font-size="13" fill="#555555">
<text x="388" y="105">cap. 3</text><text x="388" y="183">cap. 2 e 3</text><text x="388" y="223">cap. 3</text><text x="388" y="281">cap. 3</text>
</g>
<text x="300" y="315" text-anchor="middle" font-size="13" fill="#555555">Casca sólida (laranja e azul) + miolo leve (cinza) = o modelo de toda peça FDM.</text>
</svg>
