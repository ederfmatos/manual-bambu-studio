<line x1="380" y1="400" x2="380" y2="90" stroke="#555555" stroke-width="2"/>
<polygon points="380,80 374,94 386,94" fill="#555555"/>
<text x="392" y="100" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">mais fluxo (mm³/s)</text>
<text x="392" y="400" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">início (ex.: 5)</text>
<text x="392" y="196" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#D7263D">falhas começam</text>
<text x="392" y="214" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#D7263D">aqui: meça a altura</text>
<line x1="110" y1="400" x2="110" y2="200" stroke="#2E86AB" stroke-width="2"/>
<line x1="104" y1="400" x2="116" y2="400" stroke="#2E86AB" stroke-width="2"/><line x1="104" y1="200" x2="116" y2="200" stroke="#2E86AB" stroke-width="2"/>
<text x="98" y="305" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2E86AB">altura</text>
<text x="300" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333">Máximo = início + (altura medida × passo)</text>
<text x="300" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#555555">Depois, desconte 10–20% de margem de segurança.</text>
