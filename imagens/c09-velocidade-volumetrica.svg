<line x1="175" y1="123" x2="215" y2="123" stroke="#ffffff" stroke-width="3"/>
<line x1="248" y1="128" x2="288" y2="128" stroke="#ffffff" stroke-width="3"/>
<line x1="165" y1="136" x2="205" y2="136" stroke="#ffffff" stroke-width="3"/>
<line x1="256" y1="141" x2="296" y2="141" stroke="#ffffff" stroke-width="3"/>
<line x1="175" y1="149" x2="215" y2="149" stroke="#ffffff" stroke-width="3"/>
<line x1="240" y1="154" x2="280" y2="154" stroke="#ffffff" stroke-width="3"/>
