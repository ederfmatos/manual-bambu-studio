<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="300" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#333333">Teste de velocidade volumétrica máxima</text>
