<svg xmlns="http://www.w3.org/2000/svg" width="600" height="310" viewBox="0 0 600 310">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="300" y="26" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold">Compensação X-Y de furo e de contorno (vista de cima)</text>
<rect x="50" y="70.0" width="200" height="140.0" fill="#F28C28" stroke="none" stroke-width="1" rx="6"/>
<circle cx="150" cy="140" r="30" fill="#ffffff" stroke="#555555" stroke-width="2"/>
<circle cx="150" cy="140" r="25" fill="none" stroke="#D7263D" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="150" y="245" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">Furo +0,1 mm</text>
<text x="150" y="265" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#555555" font-weight="normal">furo cresce: pino entra mais fácil</text>
<rect x="355" y="73.5" width="190" height="133.0" fill="#F28C28" stroke="none" stroke-width="1" rx="6"/>
<circle cx="450" cy="140" r="25" fill="#ffffff" stroke="#555555" stroke-width="2"/>
<rect x="355" y="73.5" width="190" height="133" fill="none" stroke="#D7263D" stroke-width="1.5" stroke-dasharray="4 3" rx="6"/>
<rect x="350" y="70" width="200" height="140" fill="none" stroke="#555555" stroke-width="1" rx="6"/>
<text x="450" y="245" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">Contorno −0,1 mm</text>
<text x="450" y="265" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#555555" font-weight="normal">peça encolhe por fora</text>
<text x="300" y="295" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#555555" font-weight="normal">Tracejado vermelho = medida original</text>

</svg>
