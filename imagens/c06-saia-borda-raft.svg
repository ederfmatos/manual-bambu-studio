<text x="300" y="250" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">Borda (Brim)</text>
<text x="300" y="270" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">voltas coladas na peça,</text>
<text x="300" y="287" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">aumentam a área de adesão</text>
