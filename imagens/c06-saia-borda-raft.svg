<text x="500" y="250" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">Raft</text>
<text x="500" y="270" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">plataforma inteira por</text>
<text x="500" y="287" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">baixo (aba Suporte)</text>
<text x="300" y="325" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#555555" font-weight="normal">Laranja = peça; vermelho = distância da saia</text>
