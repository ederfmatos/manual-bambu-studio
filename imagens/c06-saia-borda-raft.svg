<text x="100" y="250" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">Saia (Skirt)</text>
<text x="100" y="270" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">contorno solto, não toca</text>
<text x="100" y="287" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">a peça: só escorva o bico</text>
