<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="300" y="26" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold">Vista de cima: saia, borda e raft</text>
<rect x="60" y="120" width="80" height="80" fill="#F28C28"/>
<rect x="38" y="98" width="124" height="124" fill="none" stroke="#555555" stroke-width="3" rx="6"/>
