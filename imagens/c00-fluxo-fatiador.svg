<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333333">Do modelo 3D à peça impressa</text>
<!-- 1 modelo -->
<polygon points="50,170 90,150 130,170 90,190" fill="#BBBBBB" stroke="#555555"/>
<polygon points="50,170 50,110 90,90 90,150" fill="#DDDDDD" stroke="#555555"/>
<polygon points="90,150 90,90 130,110 130,170" fill="#999999" stroke="#555555"/>
<polygon points="50,110 90,90 130,110 90,130" fill="#EEEEEE" stroke="#555555"/>
<text x="90" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Modelo</text>
<text x="90" y="238" text-anchor="middle" font-size="13" fill="#555555">STL / 3MF</text>
<!-- seta -->
<path d="M145 140 H170" stroke="#555555" stroke-width="2"/><polygon points="170,134 180,140 170,146" fill="#555555"/>
<!-- 2 camadas -->
<g fill="#F28C28" stroke="#C06A10">
<rect x="195" y="95" width="80" height="10" rx="2"/><rect x="195" y="110" width="80" height="10" rx="2"/><rect x="195" y="125" width="80" height="10" rx="2"/><rect x="195" y="140" width="80" height="10" rx="2"/><rect x="195" y="155" width="80" height="10" rx="2"/><rect x="195" y="170" width="80" height="10" rx="2"/>
</g>
<text x="235" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Fatias</text>
<text x="235" y="238" text-anchor="middle" font-size="13" fill="#555555">camadas finas</text>
<path d="M290 140 H315" stroke="#555555" stroke-width="2"/><polygon points="315,134 325,140 315,146" fill="#555555"/>
<!-- 3 trajetos -->
<rect x="340" y="95" width="80" height="80" fill="none" stroke="#F28C28" stroke-width="4"/>
<rect x="348" y="103" width="64" height="64" fill="none" stroke="#2E86AB" stroke-width="3"/>
<path d="M352 163 L408 107 M352 143 L388 107 M352 123 L368 107 M372 163 L408 127 M392 163 L408 147" stroke="#BBBBBB" stroke-width="2"/>
<text x="380" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Trajetos</text>
<text x="380" y="238" text-anchor="middle" font-size="13" fill="#555555">paredes + miolo</text>
<path d="M435 140 H460" stroke="#555555" stroke-width="2"/><polygon points="460,134 470,140 460,146" fill="#555555"/>
<!-- 4 gcode -->
<rect x="480" y="90" width="90" height="95" rx="4" fill="#F4F4F4" stroke="#555555"/>
<text x="490" y="112" font-size="13" fill="#333333" font-family="Courier New, monospace">G1 X10 Y5</text>
<text x="490" y="130" font-size="13" fill="#333333" font-family="Courier New, monospace">G1 E0.8</text>
<text x="490" y="148" font-size="13" fill="#333333" font-family="Courier New, monospace">G1 Z0.4</text>
<text x="490" y="166" font-size="13" fill="#333333" font-family="Courier New, monospace">M106 S255</text>
<text x="525" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">G-code</text>
<text x="525" y="238" text-anchor="middle" font-size="13" fill="#555555">ordens à impressora</text>
<text x="300" y="280" text-anchor="middle" font-size="13" fill="#555555">O fatiador faz os três últimos passos; cada configuração muda como eles são feitos.</text>
</svg>
