<svg xmlns="http://www.w3.org/2000/svg" width="600" height="368" viewBox="0 0 600 368">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<text x="300" y="26" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold">Quem manda em quem: do geral ao específico</text>
<rect x="20.0" y="50" width="560" height="58" fill="#BBBBBB" stroke="none" stroke-width="1" rx="8"/>
<text x="300" y="75" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#222222" font-weight="bold">Predefinição de processo (global)</text>
<text x="300" y="96" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">vale para toda a placa</text>
<rect x="65.0" y="122" width="470" height="58" fill="#2E86AB" stroke="none" stroke-width="1" rx="8"/>
<text x="300" y="147" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">Configuração por objeto</text>
<text x="300" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="normal">sobrepõe o global só naquele objeto</text>
<rect x="110.0" y="194" width="380" height="58" fill="#F28C28" stroke="none" stroke-width="1" rx="8"/>
<text x="300" y="219" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">Peça / modificador / faixa de altura</text>
<text x="300" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="normal">sobrepõe o objeto só naquela região</text>
<rect x="155.0" y="266" width="290" height="58" fill="#D7263D" stroke="none" stroke-width="1" rx="8"/>
<text x="300" y="291" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">Pintura (suporte, costura, cor)</text>
<text x="300" y="312" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="normal">detalhe local, face a face</text>
<text x="300" y="352" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#555555" font-weight="normal">Regra: o nível mais específico vence o mais geral.</text>

</svg>
