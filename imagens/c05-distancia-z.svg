<svg xmlns="http://www.w3.org/2000/svg" width="600" height="315" viewBox="0 0 600 315">
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="300" y="26" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Distância Z superior: folga entre suporte e peça</text>
<text x="105" y="58" font-size="16" text-anchor="middle" fill="#D7263D" font-weight="bold">0 mm</text>
<rect x="30" y="75" width="150" height="40" fill="#F28C28" stroke="#555555"/>
<rect x="30" y="115" width="150" height="14" fill="#2E86AB" stroke="#555555"/>
<rect x="30" y="129" width="150" height="61" fill="#BBBBBB" stroke="#555555"/>
<rect x="20" y="190" width="170" height="10" fill="#444444"/>
<text x="105" y="225" font-size="14" text-anchor="middle" fill="#D7263D" font-weight="bold">solda na peça</text>
<text x="105" y="245" font-size="13" text-anchor="middle" fill="#333">(só com filamento</text>
<text x="105" y="263" font-size="13" text-anchor="middle" fill="#333">de suporte)</text>
<text x="300" y="58" font-size="16" text-anchor="middle" fill="#F28C28" font-weight="bold">0,1 mm</text>
<rect x="225" y="75" width="150" height="40" fill="#F28C28" stroke="#555555"/>
<rect x="225" y="125" width="150" height="14" fill="#2E86AB" stroke="#555555"/>
<rect x="225" y="139" width="150" height="51" fill="#BBBBBB" stroke="#555555"/>
<line x1="385" y1="115" x2="385" y2="125" stroke="#222" stroke-width="2"/>
<line x1="380" y1="115" x2="390" y2="115" stroke="#222"/>
<line x1="380" y1="125" x2="390" y2="125" stroke="#222"/>
<rect x="215" y="190" width="170" height="10" fill="#444444"/>
<text x="300" y="225" font-size="14" text-anchor="middle" fill="#F28C28" font-weight="bold">semi-destacável</text>
<text x="300" y="245" font-size="13" text-anchor="middle" fill="#333">melhor acabamento,</text>
<text x="300" y="263" font-size="13" text-anchor="middle" fill="#333">sai com esforço</text>
<text x="495" y="58" font-size="16" text-anchor="middle" fill="#2A9D4B" font-weight="bold">0,2 mm</text>
<rect x="420" y="75" width="150" height="40" fill="#F28C28" stroke="#555555"/>
<path d="M 420 115 Q 440 121 460 115 Q 480 121 500 115 Q 520 121 540 115 Q 560 121 570 115" fill="none" stroke="#555555" stroke-width="2"/>
<rect x="420" y="137" width="150" height="14" fill="#2E86AB" stroke="#555555"/>
<rect x="420" y="151" width="150" height="39" fill="#BBBBBB" stroke="#555555"/>
<line x1="580" y1="115" x2="580" y2="137" stroke="#222" stroke-width="2"/>
<line x1="575" y1="115" x2="585" y2="115" stroke="#222"/>
<line x1="575" y1="137" x2="585" y2="137" stroke="#222"/>
<rect x="410" y="190" width="170" height="10" fill="#444444"/>
<text x="495" y="225" font-size="14" text-anchor="middle" fill="#2A9D4B" font-weight="bold">destacável</text>
<text x="495" y="245" font-size="13" text-anchor="middle" fill="#333">sai fácil, face</text>
<text x="495" y="263" font-size="13" text-anchor="middle" fill="#333">de baixo mais áspera</text>
<text x="300" y="295" font-size="13" text-anchor="middle" fill="#555">Folga maior = remoção fácil. Folga menor = superfície de baixo mais lisa.</text>
</g>
</svg>
