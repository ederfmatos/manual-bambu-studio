<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="300" y="28" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">Temperatura do bico x fluxo máximo</text>
  <!-- zonas -->
  <rect x="80" y="50" width="110" height="280" fill="#2E86AB" fill-opacity="0.12"/>
  <rect x="190" y="50" width="230" height="280" fill="#2A9D4B" fill-opacity="0.12"/>
  <rect x="420" y="50" width="150" height="280" fill="#D7263D" fill-opacity="0.12"/>
  <text x="135" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2E86AB" text-anchor="middle">Frio demais</text>
  <text x="305" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#2A9D4B" text-anchor="middle">Faixa útil</text>
  <text x="495" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#D7263D" text-anchor="middle">Quente demais</text>
  <!-- eixos -->
  <line x1="80" y1="330" x2="575" y2="330" stroke="#555555" stroke-width="2"/>
  <line x1="80" y1="330" x2="80" y2="45" stroke="#555555" stroke-width="2"/>
  <polygon points="575,325 585,330 575,335" fill="#555555"/>
  <polygon points="75,45 80,35 85,45" fill="#555555"/>
  <text x="330" y="360" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333" text-anchor="middle">Temperatura do bico (°C)</text>
  <text x="30" y="190" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333333" text-anchor="middle" transform="rotate(-90 30 190)">Fluxo máximo (mm³/s)</text>
  <!-- curva -->
  <path d="M 90 310 C 160 300, 200 240, 260 180 S 380 105, 440 95 S 540 92, 570 92" fill="none" stroke="#F28C28" stroke-width="4"/>
  <!-- marcador -->
  <circle cx="330" cy="125" r="6" fill="#F28C28" stroke="#555555" stroke-width="1.5"/>
  <line x1="330" y1="131" x2="330" y2="330" stroke="#555555" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="340" y="160" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333333">ponto típico do perfil</text>
  <text x="440" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#D7263D">fios, bolhas,</text>
  <text x="440" y="147" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#D7263D">brilho excessivo</text>
  <text x="90" y="230" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2E86AB">subextrusão,</text>
  <text x="90" y="247" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2E86AB">camadas fracas</text>
  <text x="300" y="388" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" text-anchor="middle">Mais calor derrete mais plástico por segundo, mas o ganho diminui e a qualidade cai.</text>
</svg>
