<rect x="40" y="134" width="220" height="40" fill="#BBBBBB"/>
<text x="150" y="159" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">interior da peça</text>
<text x="450" y="60" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">Pele difusa</text>
<rect x="340" y="116" width="220" height="28" fill="#2E86AB" opacity="0.18"/>
<polyline points="340,123.1 356,119.7 372,127.3 388,121.0 404,118.7 420,127.4 436,140.9 452,137.8 468,136.9 484,122.8 500,131.0 516,124.2 532,121.5 548,119.8" fill="none" stroke="#F28C28" stroke-width="4" stroke-linejoin="round"/>
<rect x="340" y="146" width="220" height="28" fill="#BBBBBB"/>
<text x="450" y="165" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#222222" font-weight="normal">interior</text>
<line x1="575" y1="116" x2="575" y2="144" stroke="#D7263D" stroke-width="2"/>
<line x1="570" y1="116" x2="580" y2="116" stroke="#D7263D" stroke-width="2"/><line x1="570" y1="144" x2="580" y2="144" stroke="#D7263D" stroke-width="2"/>
<text x="450" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#2E86AB" font-weight="normal">faixa azul = espessura (Thickness)</text>
<line x1="372" y1="230" x2="388" y2="230" stroke="#D7263D" stroke-width="2"/>
<line x1="372" y1="224" x2="372" y2="236" stroke="#D7263D" stroke-width="2"/><line x1="388" y1="224" x2="388" y2="236" stroke="#D7263D" stroke-width="2"/>
<text x="398" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#D7263D" font-weight="normal">distância entre pontos</text>
<text x="300" y="275" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#555555" font-weight="normal">Mais espessura = textura mais funda. Menos distância = textura mais fina.</text>
