<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="300" y="26" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Grau de overhang = quanto da linha fica “no ar”</text>
<rect x="28" y="120" width="60" height="26" rx="13" fill="#BBBBBB" stroke="#555555"/>
<rect x="31.0" y="92" width="60" height="26" rx="13" fill="#2A9D4B" stroke="#555555"/>
<line x1="88" y1="80" x2="88" y2="160" stroke="#555" stroke-dasharray="3,3"/>
<text x="58" y="190" font-size="15" text-anchor="middle" fill="#2A9D4B" font-weight="bold">0–10%</text>
<text x="58" y="210" font-size="13" text-anchor="middle" fill="#333">velocidade</text>
<text x="58" y="228" font-size="13" text-anchor="middle" fill="#333">da parede</text>
<rect x="140" y="120" width="60" height="26" rx="13" fill="#BBBBBB" stroke="#555555"/>
<rect x="150.8" y="92" width="60" height="26" rx="13" fill="#2A9D4B" stroke="#555555"/>
<line x1="200" y1="80" x2="200" y2="160" stroke="#555" stroke-dasharray="3,3"/>
<text x="170" y="190" font-size="15" text-anchor="middle" fill="#2A9D4B" font-weight="bold">10–25%</text>
<text x="170" y="210" font-size="13" text-anchor="middle" fill="#333">faixa 1</text>
<text x="170" y="228" font-size="13" text-anchor="middle" fill="#333">(0 = sem</text>
<text x="170" y="246" font-size="13" text-anchor="middle" fill="#333">redução)</text>
<rect x="252" y="120" width="60" height="26" rx="13" fill="#BBBBBB" stroke="#555555"/>
<rect x="276.0" y="92" width="60" height="26" rx="13" fill="#F28C28" stroke="#555555"/>
<line x1="312" y1="80" x2="312" y2="160" stroke="#555" stroke-dasharray="3,3"/>
<text x="282" y="190" font-size="15" text-anchor="middle" fill="#F28C28" font-weight="bold">25–50%</text>
<text x="282" y="210" font-size="13" text-anchor="middle" fill="#333">faixa 2</text>
<text x="282" y="228" font-size="13" text-anchor="middle" fill="#333">50 mm/s</text>
<rect x="364" y="120" width="60" height="26" rx="13" fill="#BBBBBB" stroke="#555555"/>
<rect x="401.2" y="92" width="60" height="26" rx="13" fill="#F28C28" stroke="#555555"/>
<line x1="424" y1="80" x2="424" y2="160" stroke="#555" stroke-dasharray="3,3"/>
<text x="394" y="190" font-size="15" text-anchor="middle" fill="#F28C28" font-weight="bold">50–75%</text>
<text x="394" y="210" font-size="13" text-anchor="middle" fill="#333">faixa 3</text>
<text x="394" y="228" font-size="13" text-anchor="middle" fill="#333">30 mm/s</text>
<rect x="476" y="120" width="60" height="26" rx="13" fill="#BBBBBB" stroke="#555555"/>
<rect x="528.8" y="92" width="60" height="26" rx="13" fill="#D7263D" stroke="#555555"/>
<line x1="536" y1="80" x2="536" y2="160" stroke="#555" stroke-dasharray="3,3"/>
<text x="506" y="190" font-size="15" text-anchor="middle" fill="#D7263D" font-weight="bold">75–100%</text>
<text x="506" y="210" font-size="13" text-anchor="middle" fill="#333">faixa 4</text>
<text x="506" y="228" font-size="13" text-anchor="middle" fill="#333">10 mm/s</text>
<text x="300" y="70" font-size="13" text-anchor="middle" fill="#555">linha nova (cor) sobre a linha da camada de baixo (cinza)</text>
<rect x="40" y="268" width="520" height="56" rx="8" fill="#F4F4F4" stroke="#BBBBBB"/>
<text x="300" y="291" font-size="14" text-anchor="middle" fill="#333">100% (linha sem apoio nenhum) usa a velocidade de ponte</text>
<text x="300" y="312" font-size="13" text-anchor="middle" fill="#555">ou a de overhang 100%. Valores: perfil 0,20 mm Standard (X1C).</text>
</g>
</svg>
