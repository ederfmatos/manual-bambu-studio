<svg xmlns="http://www.w3.org/2000/svg" width="600" height="325" viewBox="0 0 600 325">
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="300" y="26" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Jangada (raft): a peça impressa sobre uma plataforma</text>
<rect x="40" y="250" width="520" height="14" fill="#444444"/>
<text x="300" y="284" font-size="13" text-anchor="middle" fill="#555">mesa</text>
<rect x="100" y="236" width="400" height="14" fill="#BBBBBB" stroke="#555555"/>
<rect x="130" y="208" width="340" height="14" fill="#BBBBBB" stroke="#555555"/>
<rect x="130" y="222" width="340" height="14" fill="#BBBBBB" stroke="#555555"/>
<rect x="130" y="196" width="340" height="12" fill="#2E86AB" stroke="#555555"/>
<rect x="160" y="80" width="280" height="110" fill="#F28C28" stroke="#555555"/>
<text x="300" y="140" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">peça</text>
<line x1="470" y1="193" x2="520" y2="170" stroke="#222"/>
<text x="522" y="166" font-size="13" text-anchor="start" fill="#222">contato Z</text>
<line x1="470" y1="202" x2="520" y2="200" stroke="#222"/>
<text x="522" y="205" font-size="13" text-anchor="start" fill="#222">interface</text>
<line x1="470" y1="225" x2="520" y2="230" stroke="#222"/>
<text x="522" y="235" font-size="13" text-anchor="start" fill="#222">camadas</text>
<line x1="100" y1="300" x2="130" y2="300" stroke="#D7263D" stroke-width="2"/>
<line x1="100" y1="294" x2="100" y2="306" stroke="#D7263D" stroke-width="2"/>
<line x1="130" y1="294" x2="130" y2="306" stroke="#D7263D" stroke-width="2"/>
<text x="140" y="305" font-size="13" text-anchor="start" fill="#D7263D">expansão da 1ª camada (mais área colada na mesa)</text>
<text x="300" y="60" font-size="13" text-anchor="middle" fill="#555">A folga Z do raft (padrão 0,1 mm) separa a peça do raft na hora de remover</text>
</g>
</svg>
