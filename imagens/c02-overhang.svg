<svg xmlns="http://www.w3.org/2000/svg" width="600" height="275" viewBox="0 0 600 275">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="300" y="26" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" fill="#222222" font-weight="bold">Grau de overhang medido em fração da largura da linha</text>
<rect x="30" y="150" width="40" height="18" fill="#BBBBBB" stroke="none" stroke-width="1" rx="6"/>
<rect x="30" y="130" width="40" height="18" fill="#F28C28" stroke="none" stroke-width="1" rx="6"/>
<line x1="70" y1="120" x2="70" y2="175" stroke="#D7263D" stroke-width="1" stroke-dasharray="3 3"/>
<text x="60" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">0%</text>
<rect x="142" y="150" width="40" height="18" fill="#BBBBBB" stroke="none" stroke-width="1" rx="6"/>
<rect x="152" y="130" width="40" height="18" fill="#F28C28" stroke="none" stroke-width="1" rx="6"/>
<line x1="182" y1="120" x2="182" y2="175" stroke="#D7263D" stroke-width="1" stroke-dasharray="3 3"/>
<text x="172" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">25%</text>
<rect x="254" y="150" width="40" height="18" fill="#BBBBBB" stroke="none" stroke-width="1" rx="6"/>
<rect x="274" y="130" width="40" height="18" fill="#F28C28" stroke="none" stroke-width="1" rx="6"/>
<line x1="294" y1="120" x2="294" y2="175" stroke="#D7263D" stroke-width="1" stroke-dasharray="3 3"/>
<text x="284" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">50%</text>
<rect x="366" y="150" width="40" height="18" fill="#BBBBBB" stroke="none" stroke-width="1" rx="6"/>
<rect x="396" y="130" width="40" height="18" fill="#F28C28" stroke="none" stroke-width="1" rx="6"/>
<line x1="406" y1="120" x2="406" y2="175" stroke="#D7263D" stroke-width="1" stroke-dasharray="3 3"/>
<text x="396" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">75%</text>
<rect x="478" y="150" width="40" height="18" fill="#BBBBBB" stroke="none" stroke-width="1" rx="6"/>
<rect x="518" y="130" width="40" height="18" fill="#F28C28" stroke="none" stroke-width="1" rx="6"/>
<line x1="518" y1="120" x2="518" y2="175" stroke="#D7263D" stroke-width="1" stroke-dasharray="3 3"/>
<text x="508" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#222222" font-weight="bold">100%</text>
<text x="300" y="235" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#555555" font-weight="normal">Quanto mais a linha fica "no ar", mais o Bambu Studio</text>
<text x="300" y="255" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#555555" font-weight="normal">reduz a velocidade (100% = velocidade de ponte).</text>
<text x="300" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#555555" font-weight="normal">linha de cima (laranja) sobre a de baixo (cinza)</text>

</svg>
